# Render Blueprint — WebhookRelay backend + Redis.
# Deploy: push to GitHub, then in Render → "New" → "Blueprint" and point at this repo.
#
# Provisions: backend (Docker web service) and a managed Key Value (Redis-compatible) instance
# for the WebSocket fan-out bus, cache, and rate-limit store.
#
# Database: PostgreSQL is hosted on Supabase (free tier, no 30-day suspend).
# Set DATABASE_URL as a secret env var in Render pointing to your Supabase connection string:
#   postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:6543/postgres?sslmode=require
# The app's ConnectionUrlEnvironmentPostProcessor converts it to a JDBC URL + username/password.
#
# The React frontend is deployed separately to Vercel (see .github/workflows/frontend.yml).

services:
  # Redis-compatible fan-out bus + cache + rate-limit store.
  - type: keyvalue
    name: webhookrelay-redis
    plan: free
    ipAllowList: [] # only reachable from Render services on the private network
    maxmemoryPolicy: noeviction

  - type: web
    name: webhookrelay-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Supabase PostgreSQL connection string.
      # Format: postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:6543/postgres?sslmode=require
      # Set this as a secret env var in the Render dashboard (cannot be in blueprint for secrets).
      - key: DATABASE_URL
        sync: false
      # Redis connection string (redis://:pass@host:port); parsed natively by Spring Boot.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: webhookrelay-redis
          property: connectionString
      - key: WEBHOOKRELAY_CORS_ALLOWED_ORIGINS
        # Set to the frontend's Vercel URL, e.g. https://webhookrelay.vercel.app
        # Never use "*" in production.
        sync: false
      # HS256 signing key (>= 32 bytes). Generate locally with: openssl rand -hex 32
      - key: WEBHOOKRELAY_JWT_SECRET
        generateValue: true
